name: Keep Streamlit Apps Alive

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'
  
  # Run whenever you push to the repo
  push:
    branches:
      - main
      - master
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  wake-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Allow enough time for apps to wake up (5 min each + buffer)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager
    
    - name: Wake up Streamlit apps
      run: |
        echo "Waking up Streamlit apps..."
        python keep_alive_dual.py
      continue-on-error: false
    
    - name: Upload debug files
      if: always()  # Always upload, even on success
      uses: actions/upload-artifact@v4
      with:
        name: debug-files
        path: |
          *.png
          *.html
        if-no-files-found: ignore
